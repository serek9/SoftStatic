<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Phase 57.2: played from the home screen without the browser's bars. -->
<link rel="manifest" href="manifest.webmanifest">
<!-- 8.4 #37: written by node tools/icon.js from the grid in js/core/device.js. -->
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SoftStatic">
<meta name="theme-color" content="#000000">
<title>SoftStatic</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* Phase 57.2: no zoom, overscroll, selection, callout or tap highlight on a phone. */
  html, body {
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  /* G.core.device places and sizes the canvas (Phase 57.1). */
  #game {
    position: absolute; left: 0; top: 0;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>

<!-- Load order is fixed (§0.4): core → data → sim → gfx → scene → ui → audio → boot. -->
<!-- core (debug first so it catches errors thrown while the other scripts load) -->
<script src="js/core/debug.js"></script>
<script src="js/core/rng.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/input.js"></script>
<script src="js/core/device.js"></script>
<script src="js/core/save.js"></script>
<script src="js/core/loop.js"></script>
<!-- data -->
<script src="data/loc_fog.js"></script>
<script src="data/loc_creek.js"></script>
<script src="data/loc_pines.js"></script>
<script src="data/loc_copper.js"></script>
<script src="data/loc_harts.js"></script>
<script src="data/loc_stone.js"></script>
<script src="data/loc_russet.js"></script>
<script src="data/loc_sound.js"></script>
<script src="data/loc_wreck.js"></script>
<script src="data/loc_tamarack.js"></script>
<script src="data/fish.js"></script>
<script src="data/fishlooks.js"></script>
<script src="data/lurelooks.js"></script>
<script src="data/gear.js"></script>
<script src="data/dialogue.js"></script>
<script src="data/anomalies.js"></script>
<script src="data/looks.js"></script>
<!-- sim -->
<script src="js/sim/clock.js"></script>
<script src="js/sim/unease.js"></script>
<script src="js/sim/fish_ai.js"></script>
<script src="js/sim/bite.js"></script>
<script src="js/sim/fight.js"></script>
<script src="js/sim/economy.js"></script>
<!-- gfx -->
<script src="js/gfx/bake.js"></script>
<script src="js/gfx/sprites.js"></script>
<script src="js/gfx/paint.js"></script>
<script src="js/gfx/pix.js"></script>
<script src="js/gfx/fx.js"></script>
<script src="js/gfx/water.js"></script>
<script src="js/gfx/surface.js"></script>
<script src="js/gfx/rope.js"></script>
<script src="js/gfx/rod.js"></script>
<script src="js/gfx/fishgen.js"></script>
<script src="js/gfx/luregen.js"></script>
<!-- scene -->
<script src="js/scene/boat.js"></script>
<script src="js/scene/fisher.js"></script>
<script src="js/scene/dog.js"></script>
<script src="js/scene/underwater.js"></script>
<script src="js/scene/life.js"></script>
<script src="js/scene/scenery.js"></script>
<script src="js/scene/rivers.js"></script>
<script src="js/scene/lakes.js"></script>
<script src="js/scene/seas.js"></script>
<script src="js/scene/sailing.js"></script>
<!-- ui -->
<script src="js/ui/hud.js"></script>
<script src="js/ui/panel.js"></script>
<script src="js/ui/card.js"></script>
<script src="js/ui/setup.js"></script>
<script src="js/ui/look.js"></script>
<script src="js/ui/menu.js"></script>
<script src="js/ui/journal.js"></script>
<script src="js/ui/room.js"></script>
<script src="js/ui/room_kit.js"></script>
<script src="js/ui/shop_room.js"></script>
<script src="js/ui/shop.js"></script>
<script src="js/ui/map.js"></script>
<script src="js/ui/dock.js"></script>
<script src="js/ui/cabin.js"></script>
<!-- audio -->
<script src="js/audio/engine.js"></script>

<!-- boot -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  // ?compact (12.5): a 160×90 view with no HUD for a second monitor. The
  // game still draws at 640×360 into an offscreen canvas, which is shrunk onto the page.
  G.core.compact = q.has('compact');
  var V = G.core.view, W = G.core.compact ? 160 : V.W, H = G.core.compact ? 90 : V.H;
  var canvas = document.getElementById('game');
  canvas.width = W; canvas.height = H;
  var vctx = canvas.getContext('2d', { alpha: false });
  var ctx = G.core.compact ? G.gfx.bake.canvas(V.W, V.H).getContext('2d') : vctx;

  // The fit (Phase 57.1, G.core.device): on a PC the largest whole-number scale that fits,
  // in device pixels, as before; on a phone the picture fills the safe area.
  G.core.device.attach(canvas, W, H);

  G.core.save.claim(); // this tab owns the save now (12.5)
  G.state.save = G.core.save.load();

  // ?seed=N wins; otherwise the sim RNG carries on from the save (visual RNG starts fresh).
  var seed = parseInt(q.get('seed'), 10);
  if (!isNaN(seed)) G.core.rng.seedAll(seed);
  else {
    G.core.rng.seedAll(Date.now() | 0);
    if (G.state.save.rng !== null) G.rng.setState(G.state.save.rng);
  }
  G.core.input.attach(canvas);

  G.core.state.register('sailing', G.scene.sailing);
  G.core.state.register('shop', G.ui.shop);
  G.core.state.register('cabin', G.ui.cabin);
  G.core.state.register('gallery', G.core.debug.gallery);
  G.core.state.change(q.has('gallery') ? 'gallery' : 'sailing');

  // Another tab owns the save (12.5): this one waits, and a click or key brings it back here.
  function reclaim() { if (G.core.save.lost()) { G.core.save.claim(); location.reload(); } }
  canvas.addEventListener('mousedown', reclaim);
  canvas.addEventListener('touchend', reclaim); // 57.4: a touch never sends mousedown here (input.js cancels it)
  window.addEventListener('keydown', reclaim);
  function idle(c) {
    var F = G.gfx.sprites.fine, A = 'Fishing in another tab.', B = G.core.device.touch() ? 'Tap to fish here.' : 'Click to fish here.';
    V.begin(c, true);
    G.ui.menu.dim(c, 0.75);
    F.bold(c, A, 320 - (F.measureBold(A) >> 1), 156, 'fog_light');
    F.drawText(c, B, 320 - (F.measure(B) >> 1), 176, 'fog_mid');
  }

  // An open overlay (pause, journal, map, look picker) takes the step and the scene waits (9.2).
  var warmed = false;
  G.core.loop.start({
    update: function (dt) { if (!G.ui.menu.update(dt)) G.core.state.update(dt); G.audio.engine.step(dt); },
    // Each part draws in its own space (G.core.view): the scene, the overlay, the buttons.
    draw: function (ctx) {
      V.begin(ctx, G.core.state.native()); G.core.state.draw(ctx);
      V.begin(ctx, G.ui.menu.native()); G.ui.menu.draw(ctx);
      V.begin(ctx, false); G.ui.hud.drawButtons(ctx);
      V.begin(ctx, true); G.core.device.drawNotice(ctx); // 57.3: portrait on a phone
      if (!warmed) warmed = G.ui.journal.warm(1); // 8.4 #24: the journal's pictures, one a frame, off screen
    },
    idle: idle,
    // ?compact: halve the full picture onto the page canvas (smoothed, so 1 px lines survive).
    present: G.core.compact ? function (c) { vctx.imageSmoothingEnabled = true; c.setTransform(1, 0, 0, 1, 0, 0); vctx.drawImage(c.canvas, 0, 0, V.W, V.H, 0, 0, W, H); vctx.imageSmoothingEnabled = false; } : null
  }, ctx);
})();
</script>
</body>
</html>
